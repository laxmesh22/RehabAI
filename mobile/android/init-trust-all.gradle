// Local-only workaround: this machine's JDK cannot validate Maven TLS chains (PKIX).
// Allows assembleDebug to fetch AndroidX deps. Do not use for production CI trust policy.
import javax.net.ssl.*
import java.security.cert.X509Certificate

def trustAll = new X509TrustManager() {
  void checkClientTrusted(X509Certificate[] chain, String authType) {}
  void checkServerTrusted(X509Certificate[] chain, String authType) {}
  X509Certificate[] getAcceptedIssuers() { new X509Certificate[0] }
}
def sc = SSLContext.getInstance('TLS')
sc.init(null, [trustAll] as TrustManager[], new java.security.SecureRandom())
HttpsURLConnection.setDefaultSSLSocketFactory(sc.getSocketFactory())
HttpsURLConnection.setDefaultHostnameVerifier({ hostname, session -> true })
SSLContext.setDefault(sc)

gradle.projectsLoaded {
  println '[rehabai] TLS trust-all init applied for dependency download'
}
